[package]
name = "dual-pulse-launcher"
version = "0.2.0"
edition = "2021"
description = "Dual Pulse Launcher : connexion, catalogue, installation et lancement d'E.N.O.S. et de TERNA"

[lib]
name = "dual_pulse_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
dp-engine = { path = "../engine" }
