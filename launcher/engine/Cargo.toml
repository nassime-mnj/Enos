[package]
name = "dp-engine"
version = "0.1.0"
edition = "2021"
description = "Moteur du Dual Pulse Launcher : vérification des manifestes signés, téléchargements reprenables, installation, lancement"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
thiserror = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
