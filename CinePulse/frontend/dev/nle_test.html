<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NLE tests</title>
<style>:root{--ac:#e0243c}html,body{margin:0;height:100%;background:#050506}#tl{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="tl"></canvas>
<script type="module">
// Page de test (non utilisée par l'application) : le pilote Python (tests/test_cinepulse_nle.py) l'ouvre dans Edge via DevTools.
// Ici : tests du noyau pur (core.js). Les gestes tactiles réels sont envoyés par le pilote (Input.dispatchTouchEvent).
import * as core from "../js/nle/core.js";
import { TimelineCanvas } from "../js/nle/timeline_canvas.js";

const out = [];
const ok = (name, cond, detail) => out.push([name, !!cond, cond ? "" : String(detail === undefined ? "" : JSON.stringify(detail))]);
const near = (a, b, e = 1e-6) => Math.abs(a - b) < e;

function coreTests() {
  // pistes
  const p = core.createProject();
  ok("pistes initiales V2,V1,A1,A2", p.tracks.map((t) => t.id).join() === "V2,V1,A1,A2", p.tracks);
  ok("addTrack vidéo au sommet", core.addTrack(p, "video") === "V3" && p.tracks[0].id === "V3");
  ok("addTrack audio en bas", core.addTrack(p, "audio") === "A3" && p.tracks.at(-1).id === "A3");
  const vid = { id: "v", kind: "video", name: "v.mp4", duration: 10 }, img = { id: "i", kind: "image", name: "i.png" }, aud = { id: "a", kind: "audio", name: "a.wav", duration: 4 };
  const cv = core.makeClip(vid, "V1", 2), ci = core.makeClip(img, "V1", 0), ca = core.makeClip(aud, "A1", 0);
  ok("makeClip vidéo", cv.dur === 10 && cv.start === 2 && cv.in === 0 && cv.opacity === 1 && cv.volume === 1 && cv.scale === 1, cv);
  ok("makeClip image = 5 s", ci.dur === core.IMAGE_DUR);
  ok("canHost", core.canHost(p.tracks.find((t) => t.id === "V1"), "image") && !core.canHost(p.tracks.find((t) => t.id === "A1"), "video") && core.canHost(p.tracks.find((t) => t.id === "A1"), "audio") && !core.canHost(p.tracks.find((t) => t.id === "V1"), "audio"));
  p.clips.push(cv);
  ok("removeTrack refuse piste occupée", core.removeTrack(p, "V1") === false);
  ok("removeTrack piste vide", core.removeTrack(p, "V3") === true && !p.tracks.some((t) => t.id === "V3"));
  const q = core.createProject(); q.tracks = [{ id: "V1", type: "video" }, { id: "A1", type: "audio" }];
  ok("removeTrack garde la dernière de son type", core.removeTrack(q, "V1") === false && core.removeTrack(q, "A1") === false);

  // magnétisme
  const pts = [0, 5, 10];
  ok("snap proche", core.snap(5.08, pts, 0.1).value === 5);
  ok("snap hors seuil", core.snap(5.3, pts, 0.1).point === null);
  ok("snap choisit le plus proche", core.snap(7.4, [7, 7.5], 0.5).value === 7.5);
  let m = core.snapMove(pts, 5.05, 3, 0.1);
  ok("snapMove début", near(m.start, 5) && m.point === 5, m);
  m = core.snapMove(pts, 6.95, 3, 0.1);
  ok("snapMove fin sur 10", near(m.start, 7) && m.point === 10, m);
  m = core.snapMove(pts, 2, 1, 0.1);
  ok("snapMove sans accroche", m.start === 2 && m.point === null);
  const sp = core.snapPoints({ clips: [{ id: "x", start: 1, dur: 2 }, { id: "y", start: 6, dur: 1 }] }, new Set(["y"]), 4);
  ok("snapPoints exclut le clip déplacé", sp.join() === "0,4,1,3", sp);

  // placement
  const r = core.createProject();
  r.clips = [{ id: "a", track: "V1", start: 0, dur: 4 }, { id: "b", track: "V1", start: 6, dur: 4 }];
  ok("libre tel quel", core.nearestFreeStart(r, "V1", 2, 4) === 4);
  ok("chevauchement : seule place libre pour 3 s = après b", core.nearestFreeStart(r, "V1", 3, 1) === 10, core.nearestFreeStart(r, "V1", 3, 1));
  ok("trou trop petit -> après b", core.nearestFreeStart(r, "V1", 3, 5.5) === 10, core.nearestFreeStart(r, "V1", 3, 5.5));
  ok("jamais négatif", core.nearestFreeStart(r, "V1", 2, -5) >= 0 && core.nearestFreeStart(r, "V1", 2, -5) === 4);
  ok("piste vide : tel quel", core.nearestFreeStart(r, "V2", 9, 3) === 3);
  ok("exclut le clip lui-même", core.nearestFreeStart(r, "V1", 4, 0, "a") === 0);

  // redimensionnement
  const rs = core.createProject();
  const vclip = { id: "v1", asset: "v", kind: "video", track: "V1", start: 10, dur: 4, in: 2 }, iclip = { id: "i1", asset: "i", kind: "image", track: "V2", start: 0, dur: 5, in: 0 };
  const nb = { id: "n", kind: "video", track: "V1", start: 20, dur: 3, in: 0 }, pr = { id: "p", kind: "video", track: "V1", start: 6, dur: 2, in: 0 };
  rs.clips = [vclip, iclip, nb, pr];
  let z = core.resizeRight(rs, vclip, { duration: 10 }, 25, null, 0);
  ok("étirer vidéo : borné par la durée du média (in 2 + dur ≤ 10)", near(z.dur, 8), z);
  z = core.resizeRight(rs, vclip, { duration: 100 }, 25, null, 0);
  ok("étirer : borné par le voisin (20)", near(z.dur, 10), z);
  z = core.resizeRight(rs, iclip, undefined, 600, null, 0);
  ok("image : étirement sans limite (-loop 1)", near(z.dur, 600), z);
  z = core.resizeRight(rs, iclip, undefined, -3, null, 0);
  ok("durée minimale", near(z.dur, core.MIN_DUR), z);
  z = core.resizeRight(rs, vclip, { duration: 100 }, 17.04, [17], 0.1);
  ok("étirer avec magnétisme", near(z.dur, 7) && z.point === 17, z);
  z = core.resizeLeft(rs, vclip, 12, null, 0);
  ok("rogner à gauche : in avance, la fin ne bouge pas", near(z.start, 12) && near(z.in, 4) && near(z.dur, 2), z);
  z = core.resizeLeft(rs, vclip, 4, null, 0);
  ok("rogner à gauche : borné par le voisin (8) et le début du média", near(z.start, 8) && near(z.in, 0) && near(z.dur, 6), z);
  z = core.resizeLeft(rs, vclip, 8.5, null, 0);
  ok("recul impossible avant le début du média (in 2 -> start ≥ 8)", near(z.start, 8.5) && near(z.in, 0.5), z);
  z = core.resizeLeft(rs, iclip, -4, null, 0);
  ok("image : gauche bornée à 0, in reste 0", z.start === 0 && z.in === 0, z);

  // vue
  const v = { pps: 80, scrollX: 400, scrollY: 0 }, tBefore = (v.scrollX + 200) / v.pps;
  core.zoomAt(v, 160, 200);
  ok("zoomAt garde le temps sous l'ancre", near((v.scrollX + 200) / v.pps, tBefore), v);
  ok("clampPps", core.clampPps(1e6) === core.MAX_PPS && core.clampPps(0) === core.MIN_PPS);
  ok("rulerStep ≥ 80 px", core.rulerStep(10) * 10 >= 80 && core.rulerStep(300) * 300 >= 80 && core.rulerStep(300) <= 0.5, [core.rulerStep(10), core.rulerStep(300)]);
  ok("formatTime", core.formatTime(65.5, 30) === "01:05:15", core.formatTime(65.5, 30));

  // historique
  const h = new core.History(3), s = { n: 0 };
  h.push(s); s.n = 1; h.push(s); s.n = 2;
  ok("undo", h.back(s).n === 1 && h.canRedo);
  ok("redo", h.forward({ n: 1 }).n === 2);
  h.push({ n: 9 });
  ok("nouvelle action vide le redo", !h.canRedo);
  for (let i = 0; i < 10; i++) h.push({ n: i });
  ok("limite de l'historique", h.undo.length === 3);

  // EDL
  const e = core.createProject();
  e.clips = [{ id: "z", track: "A1", start: 3, dur: 2 }, { id: "y", track: "V1", start: 0, dur: 4 }];
  const edl = core.toEDL(e);
  ok("EDL : pistes utilisées, clips triés, durée", edl.tracks.map((t) => t.id).join() === "V1,A1" && edl.clips[0].id === "y" && edl.duration === 5 && edl.version === 1, edl);
  edl.clips[0].start = 99;
  ok("EDL : copie indépendante", e.clips[1].start === 0);
}

// Étape 2 : images-clés, coupe, jonctions / transitions
function coreTests2() {
  const vid = { id: "v", kind: "video", name: "v.mp4", duration: 10 }, img = { id: "i", kind: "image", name: "i.png" };
  const mk = (a, track, start, dur) => { const c = core.makeClip(a, track, start); if (dur) c.dur = dur; return c; };

  let c = mk(vid, "V1", 0, 4);
  ok("valueAt sans image-clé = valeur du clip", core.valueAt(c, "opacity", 1) === 1 && !core.isAnimated(c, "opacity"));
  core.setKeyframe(c, "opacity", 2, 1); core.setKeyframe(c, "opacity", 0, 0);
  ok("images-clés triées", c.kf.opacity.map((k) => k.t).join() === "0,2", c.kf);
  ok("interpolation linéaire, constante avant / après", near(core.valueAt(c, "opacity", 1), 0.5) && core.valueAt(c, "opacity", 3) === 1 && core.valueAt(c, "opacity", -1) === 0);
  core.setKeyframe(c, "opacity", 2.01, 0.5);
  ok("une image-clé proche est remplacée", c.kf.opacity.length === 2 && near(c.kf.opacity[1].v, 0.5), c.kf);
  ok("valeur bornée", core.setKeyframe(c, "scale", 1, 99) === 3 && core.setKeyframe(c, "scale", 1.5, -4) === 0.1);
  ok("temps borné au clip", core.setKeyframe(c, "x", 99, 0.2) === 0.2 && c.kf.x[0].t === 4);
  c = mk(vid, "V1", 0, 4);
  ok("setValue sans animation : valeur fixe", core.setValue(c, "scale", 1, 2) === 2 && c.scale === 2 && !c.kf);
  core.setKeyframe(c, "scale", 0, 2);
  core.setValue(c, "scale", 3, 1);
  ok("setValue avec animation : image-clé à l'instant", c.scale === 2 && c.kf.scale.length === 2 && c.kf.scale[1].t === 3 && c.kf.scale[1].v === 1, c.kf);
  ok("keyframeNear", core.keyframeNear(c, "scale", 3.02) && !core.keyframeNear(c, "scale", 2));
  ok("removeKeyframe", core.removeKeyframe(c, "scale", 3) && c.kf.scale.length === 1 && !core.removeKeyframe(c, "scale", 3));
  core.removeKeyframe(c, "scale", 0);
  ok("la dernière image-clé retirée fige la valeur", c.scale === 2 && c.kf === undefined, c);
  core.setKeyframe(c, "volume", 0, 0.2); core.setKeyframe(c, "volume", 4, 1.2);
  core.clearAnimation(c, "volume", 2);
  ok("clearAnimation garde la valeur courante", near(c.volume, 0.7) && !core.isAnimated(c, "volume") && c.kf === undefined, c);
  c.fadeIn = 1; c.trIn = { type: "crossfade", dur: 1 }; core.setKeyframe(c, "x", 1, 0.5);
  core.resetClip(c);
  ok("resetClip", c.scale === 1 && c.opacity === 1 && c.fadeIn === 0 && c.kf === undefined && c.trIn === undefined, c);

  c = mk(vid, "V1", 0, 4); core.setKeyframe(c, "x", 0, 0); core.setKeyframe(c, "x", 4, 1);
  let k = core.retimeKeyframes(c, 2, 2);
  ok("retimeKeyframes : rognage à gauche", k.x.length === 2 && near(k.x[0].v, 0.5) && k.x[1].t === 2 && near(k.x[1].v, 1), k);
  k = core.retimeKeyframes(c, 0, 2);
  ok("retimeKeyframes : rognage à droite", near(k.x[0].v, 0) && near(k.x[1].v, 0.5) && k.x[1].t === 2, k);
  ok("retimeKeyframes : sans animation", core.retimeKeyframes(mk(vid, "V1", 0, 4), 1, 2) === undefined);

  c = mk(vid, "V1", 0, 4); c.in = 1; c.fadeIn = 1; c.fadeOut = 1; core.setKeyframe(c, "scale", 0, 1); core.setKeyframe(c, "scale", 4, 2);
  const p = core.createProject(); p.clips.push(c);
  const r = core.splitClip(p, c, 1.5);
  ok("coupe : deux clips collés", p.clips.length === 2 && near(c.dur, 1.5) && r.start === 1.5 && near(r.dur, 2.5) && near(core.clipEnd(c), r.start), [c, r]);
  ok("coupe : le point d'entrée avance (vidéo)", near(r.in, 2.5) && c.in === 1);
  ok("coupe : fondu d'entrée à gauche, de sortie à droite", c.fadeOut === 0 && c.fadeIn === 1 && r.fadeIn === 0 && r.fadeOut === 1, [c, r]);
  ok("coupe : l'animation continue des deux côtés", near(c.kf.scale.at(-1).v, 1.375) && near(r.kf.scale[0].v, 1.375) && near(r.kf.scale.at(-1).v, 2) && r.id !== c.id, [c.kf, r.kf]);
  ok("coupe : refusée près des bords", core.splitClip(p, c, 0.05) === null && core.splitClip(p, c, 1.48) === null && core.splitClip(p, c, 99) === null && p.clips.length === 2);
  const im = mk(img, "V1", 10, 5), q = core.createProject(); q.clips.push(im);
  const ir = core.splitClip(q, im, 12);
  ok("coupe d'une image : le point d'entrée reste 0", ir.in === 0 && near(ir.dur, 3) && near(im.dur, 2));

  const a = mk(img, "V1", 0, 4), b = mk(img, "V1", 4, 4), far = mk(img, "V1", 20, 2), other = mk(img, "V2", 8, 2), pj = core.createProject();
  pj.clips.push(b, far, a, other);
  const js = core.junctions(pj);
  ok("junctions : seulement les clips collés d'une même piste", js.length === 1 && js[0].a === a && js[0].b === b && js[0].time === 4, js);
  ok("transitionOf : coupe par défaut", core.transitionOf(a, b).type === "cut");
  core.setTransition(a, b, "crossfade", 1);
  ok("fondu enchaîné", core.transitionOf(a, b).type === "crossfade" && b.trIn.dur === 1 && a.fadeOut === 0, b);
  core.setTransition(a, b, "dip", 0.5);
  ok("fondu au noir : fondus des deux bords, plus de trIn", core.transitionOf(a, b).type === "dip" && a.fadeOut === 0.5 && b.fadeIn === 0.5 && b.trIn === undefined);
  core.setTransition(a, b, "crossfade", 99);
  ok("durée bornée (≤ clips, ≤ 5 s)", b.trIn.dur === 4 && core.maxTransitionDur(a, b) === 4);
  core.setTransition(a, b, "cut");
  ok("coupe : remet tout à zéro", core.transitionOf(a, b).type === "cut" && b.trIn === undefined && a.fadeOut === 0 && b.fadeIn === 0);
  const f = mk(vid, "V1", 0, 2); f.fadeIn = 1.5; f.fadeOut = 1.5; core.normalizeClip(f);
  ok("normalizeClip : fondus ≤ durée", near(f.fadeIn + f.fadeOut, 2), f);
  const e = core.createProject(), ec = mk(vid, "V1", 0, 4); core.setKeyframe(ec, "x", 1, 0.3); e.clips.push(ec);
  ok("EDL : images-clés et transition transmises", core.toEDL(e).clips[0].kf.x[0].v === 0.3);
}

window.runCoreTests = () => { out.length = 0; coreTests(); coreTests2(); return out.slice(); };
window.T = { core, TimelineCanvas };
window.__ready = true;
</script></body></html>
