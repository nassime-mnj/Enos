<body class="on-hub" data-view="hub">
<canvas id="fx-embers" aria-hidden="true"></canvas><div id="fx-aura" aria-hidden="true"><i></i><i></i><i></i></div>
<nav id="tabs" class="rail" data-p="enos" aria-label="Modes d'échecs">
  <div class="rail-logo"><span class="rl-eye"><img src="img/ui/eye.webp" alt=""></span><span class="rl-t"><b>E.N.O.S.</b><small>ÉCHECS</small></span></div>
  <div class="rail-sc">
    <button data-t="hub" data-i="home" class="on"><span>Accueil Échecs</span></button>
    <div class="rail-h">Jouer</div>
    <button data-x="play" data-i="eye"><span>Contre E.N.O.S.</span></button>
    <button data-t="arena" data-i="swords"><span>Arène des bots</span></button>
    <button data-t="simul" data-i="grid4"><span>Simultanée</span></button>
    <button data-t="royale" data-i="crown"><span>Royale ×4</span></button>
    <button data-t="variants" data-i="flask"><span>Variantes</span></button>
    <button data-t="prime" data-i="bot"><span>ChatGPT Prime</span></button>
    <button data-x="cond" data-i="target"><span>Mise en condition</span></button>
    <div class="rail-h">Apprendre</div>
    <button data-t="learn" data-i="grad"><span>Apprendre</span></button>
    <button data-t="course" data-i="radio"><span>Cours en direct</span></button>
    <button data-x="study" data-i="book"><span>Ouvertures avec ETO</span></button>
    <button data-t="advisor" data-i="bulb"><span>Conseiller</span></button>
    <div class="rail-h">Jeux</div>
    <button data-t="flick" data-i="trophy"><span>Flick Foot</span></button>
    <button data-t="golf" data-i="target"><span>Mini-golf</span></button>
    <button data-t="bowling" data-i="target"><span>Bowling</span></button>
    <button data-t="neocite" data-i="grid4"><span>Néo-Cité</span></button>
    <button data-t="loup" data-i="eye"><span>Loup-garou</span></button>
    <button data-t="dames" data-i="grid4"><span>Dames</span></button>
    <button data-t="poker" data-i="crown"><span>Poker</span></button>
    <button data-t="chroma" data-i="flask"><span>CHROMA</span></button>
    <div class="rail-h">Analyser &amp; créer</div>
    <button data-t="game" data-i="scan"><span>Revue</span></button>
    <button data-x="hist" data-i="history"><span>Historique</span></button>
    <button data-x="train" data-i="brain"><span>Super ENOS</span></button>
    <button data-t="chessedit" data-i="clapper"><span>Chess Edit</span></button>
    <button data-t="clips" data-i="drama"><span>Game Clips</span></button>
    <button data-t="backup" data-i="database"><span>Sauvegarde</span></button>
  </div>
  <div class="rail-foot"><button id="close" data-i="close" hidden title="Revenir à E.N.O.S. (Échap)"><span>Fermer</span></button></div>
</nav>
<div id="stage">
  <div id="topbar">
    <div id="top-t"><b>Échecs</b></div>
    <button id="top-search" title="Rechercher un mode (Ctrl+K)"><span class="ts-i"></span><span>Rechercher un mode…</span><kbd>Ctrl</kbd><kbd>K</kbd></button>
    <button id="top-play" class="hb pri sm"><span class="tp-i"></span><span>Jouer</span></button>
  </div>
  <div id="page-head" hidden></div>
  <section id="hub" aria-label="Accueil Échecs"></section>
  <main>
    <div id="tool-learn" hidden><div class="suite-body" id="app-learn"></div></div>
    <div id="tool-advisor" hidden><div class="suite-body" id="app-advisor"></div></div>

    <div id="tool-arena" hidden><div class="suite-body" id="app-arena"></div></div>
    <div id="tool-flick" hidden><div class="suite-body gm-pc" id="app-flick"></div></div>
    <div id="tool-golf" hidden><div class="suite-body gm-pc" id="app-golf"></div></div>
    <div id="tool-bowling" hidden><div class="suite-body gm-pc" id="app-bowling"></div></div>
    <div id="tool-neocite" hidden><div class="suite-body gm-pc" id="app-neocite"></div></div>
    <div id="tool-loup" hidden><div class="suite-body gm-pc" id="app-loup"></div></div>
    <div id="tool-dames" hidden><div class="suite-body gm-pc" id="app-dames"></div></div>
    <div id="tool-poker" hidden><div class="suite-body gm-pc" id="app-poker"></div></div>
    <div id="tool-chroma" hidden><div class="suite-body gm-pc" id="app-chroma"></div></div>
    <div id="tool-game" hidden><div class="suite-body" id="app-game"></div></div>
    <div id="tool-course" hidden><div class="suite-body" id="app-course"><div class="card"><p class="muted">Le cours en direct s'ouvre en plein écran.</p><div class="row"><button class="btn pri" id="course-go">OUVRIR LE COURS</button></div></div></div></div>
  </main>
</div>
<div id="scrim" hidden></div><div id="sheet" class="sheet" hidden></div><div id="toast" hidden></div>
